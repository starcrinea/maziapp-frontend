<fd-shellbar>
  <!-- LOGO -->
  <fd-shellbar-logo>
    <img src="assets/images/logo.png" alt="Logo" class="logo" />
  </fd-shellbar-logo>

  <!-- ACCIONES -->
  <fd-shellbar-actions>
    <!-- ➕ NUEVO CONTACTO -->

    <fd-popover placement="bottom-end">
      <fd-popover-control>
        <button
          *ngIf="showAddButton"
          fd-shellbar-action
          fdType="transparent"
          class="ms-square-btn"
          title="Registrar contacto"
          (click)="abrirNuevoContacto()"
        >
          <fd-icon glyph="add"></fd-icon>
        </button>
      </fd-popover-control>
    </fd-popover>

    <!-- 👤 USER (AHORA BIEN POSICIONADO) -->
    <fd-popover placement="bottom-end">
      <fd-popover-control>
        <button fd-shellbar-action fdType="transparent" class="ms-square-btn">
          <!-- 👤 con imagen -->
          <fd-avatar
            *ngIf="photoReady && userPhoto"
            [image]="userPhoto"
            size="xs"
            class="fd-avatar--circle"
          >
          </fd-avatar>

          <!-- 👤 sin imagen -->
          <fd-avatar *ngIf="!photoReady || !userPhoto" size="xs" class="fd-avatar--circle">
            {{ userInitials }}
          </fd-avatar>
        </button>
      </fd-popover-control>

      <fd-popover-body>
        <div class="user-menu">
          <div class="user-header">
            <!-- con imagen -->
            <fd-avatar
              *ngIf="photoReady && userPhoto"
              [image]="userPhoto"
              size="s"
              class="fd-avatar--circle"
            >
            </fd-avatar>

            <!-- sin imagen -->
            <fd-avatar *ngIf="!photoReady || !userPhoto" size="s" class="fd-avatar--circle">
              {{ userInitials }}
            </fd-avatar>

            <div class="user-info">
              <div class="user-name">{{ userName }}</div>
              <div class="user-email" *ngIf="userEmail">{{ userEmail }}</div>
              <div class="user-role" *ngIf="userRole && userRole !== 'Sin rol'">
                {{ userRole }}
              </div>
            </div>
          </div>

          <hr />

          <div class="user-item" (click)="logout()">Cerrar sesión</div>
        </div>
      </fd-popover-body>
    </fd-popover>

    <!-- 🔲 GRID -->
    <fd-popover placement="bottom-end">
      <fd-popover-control>
        <button fd-shellbar-action fdType="transparent" class="ms-square-btn">
          <fd-icon glyph="grid"></fd-icon>
        </button>
      </fd-popover-control>

      <fd-popover-body>
        <div *ngIf="!isLoading && filteredModules.length === 0" class="empty-modules">
          <fd-icon glyph="dimension"></fd-icon>
          <div>No tienes acceso a módulos</div>
        </div>

        <div class="product-grid" *ngIf="!isLoading && filteredModules.length > 0">
          <div class="product-card" *ngFor="let m of filteredModules" (click)="go(m.route)">
            <i class="fd-product-switch__icon" [ngClass]="'sap-icon--' + m.icon"></i>

            <div class="fd-product-switch__text">
              <div class="fd-product-switch__title">{{ m.title }}</div>
              <div class="fd-product-switch__subtitle">{{ m.subtitle }}</div>
            </div>
          </div>
        </div>
      </fd-popover-body>
    </fd-popover>
  </fd-shellbar-actions>
</fd-shellbar>
